<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mini-Foglio di Calcolo</title>
  <meta name="theme-color" content="#198754">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-success px-2 py-1 gap-2 flex-nowrap">
    <span class="navbar-brand mb-0 fs-6 d-none d-sm-inline">MiniSheet</span>
    <input id="name" class="form-control form-control-sm text-center" readonly aria-label="Cella selezionata">
    <input id="fx" class="form-control form-control-sm" placeholder="Contenuto della cella (es. =SOMMA(A1:A5))" aria-label="Barra della formula" autocomplete="off">
    <div class="btn-group btn-group-sm flex-shrink-0">
      <button id="btnDemo" class="btn btn-light" title="Carica dati di prova">Demo</button>
      <button id="btnCsv" class="btn btn-light" title="Esporta CSV">CSV</button>
      <button id="btnClear" class="btn btn-light" title="Svuota il foglio">Svuota</button>
      <button id="btnInstall" class="btn btn-warning" hidden>Installa</button>
    </div>
  </nav>
  <div id="grid" tabindex="0" aria-label="Griglia del foglio di calcolo"></div>
  <div id="status" class="px-2 small text-secondary border-top">Pronto</div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
